name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Blu95-FM-${{ matrix.name }}
          path: |
            build/Blu95Synth_artefacts/Release/VST3
            build/Blu95Synth_artefacts/Release/AU
            build/Blu95Synth_artefacts/Release/Standalone
          if-no-files-found: warn
